topics_2_to_1:
  -
    topic: /tf_static
    type: tf2_msgs/msg/TFMessage
    queue_size: 1
    qos:
      history: keep_last
      depth: 100
      durability: transient_local
  -
    topic: /tf
    type: tf2_msgs/msg/TFMessage
    queue_size: 1
    qos:
      history: keep_last
      depth: 100
      durability: volatile
  -
    topic: /scan
    type: sensor_msgs/msg/LaserScan
    queue_size: 1
    qos:
      history: keep_last
      depth: 50
      durability: volatile
      reliability: reliable
  -
    topic: /map
    type: nav_msgs/msg/OccupancyGrid
    queue_size: 1
    qos:
      history: keep_all
      durability: transient_local
      reliability: reliable

topics_1_to_2:
  -
    topic: /goal_pose
    type: geometry_msgs/msg/PoseStamped

ros1_bridge:
  parameter_bridge:
    service_execution_timeout: 60
