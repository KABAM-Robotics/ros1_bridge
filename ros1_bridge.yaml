topics:
  -
    topic: /map_manager/map_list
    type: kabam_msgs/msg/MapList
    qos:
      history: keep_last
      durability: transient_local
      reliability: reliable
  -
    topic: /map_manager/current_map_info
    type: kabam_msgs/msg/MapInfo
    qos:
      history: keep_last
      durability: transient_local
      reliability: reliable
  -
    topic: /map_manager/archived_map_list
    type: kabam_msgs/msg/MapList
    qos:
      history: keep_last
      durability: transient_local
      reliability: reliable
  -
    topic: /map_manager/current_map_waypoints
    type: kabam_msgs/msg/MapWaypointList
    qos:
      history: keep_last
      durability: transient_local
      reliability: reliable
  -
    topic: /krane_map_annotation/update_map_annotations
    type: kabam_msgs/msg/MapAnnotationArray
  - 
    topic: /krane_map_annotation/smartplus/update_map_annotations
    type: kabam_msgs/msg/MapAnnotationArray 
  - 
    topic: /krane_map_annotation/no_go_zones
    type: kabam_msgs/msg/MapAnnotationArray
    qos:
      history: keep_last
      depth: 1
      durability: transient_local
      reliability: reliable
  - 
    topic: /krane_map_annotation/speed_limit_zones
    type: kabam_msgs/msg/MapAnnotationArray
    qos:
      history: keep_last
      depth: 1
      durability: transient_local
      reliability: reliable
  -
    topic: /tf_static
    type: tf2_msgs/msg/TFMessage
    queue_size: 1
    qos:
      history: keep_last
      depth: 100
      durability: transient_local
  -
    topic: /tf
    type: tf2_msgs/msg/TFMessage
    queue_size: 1
    qos:
      history: keep_last
      depth: 100
      durability: volatile
  -
    topic: /scan
    type: sensor_msgs/msg/LaserScan
    queue_size: 1
    qos:
      history: keep_last
      depth: 50
      durability: volatile
      reliability: reliable
  -
    topic: /map
    type: nav_msgs/msg/OccupancyGrid
    queue_size: 1
    qos:
      history: keep_all
      durability: transient_local
      reliability: reliable
  -
    topic: /move_base/cancel
    type: actionlib_msgs/msg/GoalID
  -
    topic: /move_base/result
    type: move_base_msgs/msg/MoveBaseActionResult
  -
    topic: /local_costmap/costmap
    type: nav_msgs/msg/OccupancyGrid
  -
    topic: /global_costmap/costmap
    type: nav_msgs/msg/OccupancyGrid
  -
    topic: /odometry/filtered
    type: nav_msgs/msg/Odometry
  -
    topic: /halo_control/odom
    type: nav_msgs/msg/Odometry
  -
    topic: /imu/data
    type: sensor_msgs/msg/Imu
  -
    topic: /rosout
    type: rcl_interfaces/msg/Log
  -
    topic: /goal_pose
    type: geometry_msgs/msg/PoseStamped
  -
    topic: /diagnostics
    type: diagnostic_msgs/msg/DiagnosticArray
  -
    topic: /diagnostics_agg
    type: diagnostic_msgs/msg/DiagnosticArray
  -
    topic: /halo_control/battery_status
    type: sensor_msgs/msg/BatteryState
  -
    topic: /cmd_vel
    type: geometry_msgs/msg/Twist
  -
    topic: /cmd_vel_user
    type: geometry_msgs/msg/Twist
  -
    topic: /cmd_mutex/override
    type: geometry_msgs/msg/Twist
  -
    topic: /kopilot_user_cmd
    type: geometry_msgs/msg/Twist
  -
    topic: /cmd_vel_nav
    type: geometry_msgs/msg/Twist
  -
    topic: /clock
    type: rosgraph_msgs/msg/Clock
  -
    topic: /initialpose
    type: geometry_msgs/msg/PoseWithCovarianceStamped
  -
    topic: /plan
    type: nav_msgs/msg/Path
  -
    topic: /plan_smoothed
    type: nav_msgs/msg/Path
  -
    topic: /pcl_pose
    type: geometry_msgs/msg/PoseWithCovarianceStamped
  -
    topic: /halo_control/mcu_state
    type: std_msgs/msg/Int32
  -
    topic: /halo_control/door_open
    type: std_msgs/msg/Bool
  -
    topic: /localization_status
    type: std_msgs/msg/Bool
  -
    topic: /camera_dock/color/camera_info
    type: sensor_msgs/msg/CameraInfo
  -
    topic: /camera_dock/color/image_raw/compressed
    type: sensor_msgs/msg/CompressedImage
  -
    topic: /camera_dock/color/image_raw
    type: sensor_msgs/msg/Image
    queue_size: 1
    qos:
      history: keep_last
      durability: volatile
      reliability: reliable
  -
    topic: /halo_control/emergency_stop
    type: std_msgs/msg/Bool
  -
    topic: /halo_control/scout_status
    type: diagnostic_msgs/msg/DiagnosticArray
  -
    topic: /halo_control/drive_status
    type: diagnostic_msgs/msg/DiagnosticStatus
  -
    topic: /halo_aux/led_status
    type: diagnostic_msgs/msg/DiagnosticArray
  -
    topic: /krane/smartplus/update_map_annotations
    type: visualization_msgs/msg/MarkerArray
  -
    topic: /krane/map_annotations/no_go_zones
    type: visualization_msgs/msg/MarkerArray
    qos:
      history: keep_last
      depth: 1
      durability: transient_local
      reliability: reliable
  -
    topic: /autodock_action/status
    type: actionlib_msgs/msg/GoalStatusArray
  -
    topic: /autodock_action/cancel
    type: actionlib_msgs/msg/GoalID
  -
    topic: /krane/current_state
    type: std_msgs/msg/String
  -
    topic: /krane/active_map
    type: std_msgs/msg/String
    qos:
      history: keep_last
      depth: 1
      durability: transient_local
      reliability: reliable
  -
    topic: /fitness_score
    type: std_msgs/msg/Float32

services_1_to_2:
  -
    service: /halo_control/release  # ROS 2 service name
    type: std_srvs/srv/Trigger  # The ROS 2 service type name
  -
    service: /halo_aux/on_led
    type: std_srvs/srv/Trigger
  -
    service: /halo_aux/off_led
    type: std_srvs/srv/Trigger
  -
    service: /halo_aux/on_siren
    type: std_srvs/srv/Trigger
  -
    service: /halo_aux/off_siren
    type: std_srvs/srv/Trigger
  -
    service: /halo_aux/off_aux
    type: std_srvs/srv/Trigger
  -
    service: /simple_autodock/dock
    type: std_srvs/srv/Trigger
  -
    service: /annotation_state/on
    type: std_srvs/srv/Trigger
  -
    service: /annotation_state/off
    type: std_srvs/srv/Trigger
  -
    service: /annotation_param_service/y_offset
    type: kabam_msgs/srv/ParamTrigger
  -
    service: /krane/set_state
    type: kabam_msgs/srv/ParamTrigger
  -
    service: /map_manager/start_mapping
    type: std_srvs/srv/Trigger
  -
    service: /map_manager/stop_mapping
    type: std_srvs/srv/Trigger
  -
    service: /map_manager/save_map
    type: kabam_msgs/srv/SaveMap
  -
    service: /map_manager/load_map
    type: kabam_msgs/srv/LoadMap
  -
    service: /map_manager/rename_map
    type: kabam_msgs/srv/UpdateMap
  -
    service: /map_manager/update_map_image
    type: kabam_msgs/srv/UpdateMap
  -
    service: /map_manager/delete_map
    type: kabam_msgs/srv/UpdateMap
  -
    service: /map_manager/archive_map
    type: kabam_msgs/srv/UpdateMap
  -
    service: /map_manager/create_waypoint
    type: kabam_msgs/srv/ManageWaypoint
  -
    service: /map_manager/rename_waypoint
    type: kabam_msgs/srv/ManageWaypoint
  -
    service: /map_manager/reposition_waypoint
    type: kabam_msgs/srv/ManageWaypoint
  -
    service: /map_manager/delete_waypoint
    type: kabam_msgs/srv/ManageWaypoint
  -
    service: /map_manager/get_waypoint
    type: kabam_msgs/srv/GetWaypoint

ros1_bridge:
  parameter_bridge:
    service_execution_timeout: 30
